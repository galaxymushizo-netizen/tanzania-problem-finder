services:
  - type: worker
    name: tanzania-problem-finder
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_agent.py --scheduler
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: BING_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_RECIPIENT
        sync: false
      - key: SCHEDULER_INTERVAL_HOURS
        value: 3
      - key: LOG_LEVEL
        value: INFO
